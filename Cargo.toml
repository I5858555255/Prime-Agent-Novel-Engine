[workspace]
members = [
	"crates/prime-agent-core",
	"crates/prime-agent-ai",
	"crates/prime-agent-coding-agent",
	"crates/prime-agent-cli",
	"crates/prime-agent-tui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/PrimeIntellect-ai/prime-agent"
rust-version = "1.95"
version = "0.1.7"

[workspace.dependencies]
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std"] }
getrandom = "0.2.15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
