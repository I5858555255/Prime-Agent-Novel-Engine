[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-skill-arxiv"
version = "0.1.0"
description = "RLM skill for arXiv paper search and metadata retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm"]

[project.scripts]
arxiv = "rlm.skill:cli"

[tool.setuptools.packages.find]
where = ["src"]
