[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlm-skill-prime_rl_train"
version = "0.1.0"
description = "RLM skill for Prime Intellect hosted RL training runs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm"]

[project.scripts]
prime_rl_train = "rlm.skill:cli"

[tool.setuptools.packages.find]
where = ["src"]
