[project]
name = "rlm-skill-websearch"
version = "0.1.0"
description = "Search the web with keyless Exa MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rlm"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
