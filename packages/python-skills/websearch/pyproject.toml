[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-agent-skill-websearch"
version = "0.1.0"
description = "Prime Agent skill for web search."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
websearch = "websearch.websearch:cli"

[tool.setuptools.packages.find]
where = ["src"]
