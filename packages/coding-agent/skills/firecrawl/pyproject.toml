[project]
name = "prime-agent-skill-firecrawl"
version = "0.1.0"
description = "Web search and page extraction skill for Prime Agent (Firecrawl API)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

# No [project.scripts] entry on purpose. A skill's console script name must match
# its import name exactly, and a `firecrawl` binary is already widely installed
# (the Firecrawl CLI), so declaring one would shadow it — or be shadowed by it —
# in %%bash cells depending on PATH order. The kernel API is the supported entry
# point: `await firecrawl(...)`, `firecrawl.scrape(...)`, `firecrawl.developer(...)`.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firecrawl"]
