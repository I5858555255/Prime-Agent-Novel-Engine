# 项目约束包模板（换书复制为 config/constraints/project_constraints.yaml）
#
# 无 PyYAML 依赖的受限子集（见 constraint_pack.py）：
#   - 列表条目 "- \"K: V\"" 解析为字典项 K->V
#   - 列表条目 "- \"A = B\"" 解析为 (A, B) 二元组
#   - 标量 "key: value" 直接取值
# 换书整文件替换；各节缺省时消费方退回内置默认值（当前陆烬书现值）。
# 把下方 [占位] 全部替换为新书写法即可。

# A 路线 #8 类硬边界：主角/独修者某阶段禁止修炼样式动作（正则 = 原因）
# 换书：改主角姓名与正则；新书无此约束可整段删除。
a_route_patterns:
  - "[主角名](亲自|独自|也跟着|也)?(练习|修炼|运转|引气|吐纳|打坐|调息) = [主角名]亲自出现修炼样式动作"
  - "[主角名].{0,4}(照着|学着|模仿|跟着).{0,10}(练|练习|呼吸法|吐纳) = [主角名]模仿修炼样式动作"
  - "[主角名].{0,12}体内.{0,20}(运转|流转|共鸣|气感|气流|暖意|灵气|气机) = [主角名]体内出现气机运转/共鸣"

# 锚点追加模板：fid 锚点未命中时 force-append 进 core_event 的短语（fid: 短语）
anchor_phrases:
  - "f001: [伏笔f001名称]的[模糊描述，不点全貌]"
  - "f002: [主角名]被动性约束（仅旁观/被告知）"
  - "f005: [伏笔f005名称]在[地点]若隐若现"

# 合规尾注：追加锚点时同步写入 boundary_note 的声明
compliance_note: "（A路线合规：[主角名]此阶段仅旁观/被告知，修炼样式动作限[配角名]；plant@本章, resolve@[总章数] 前）"

# 中纲 characters 字段未登记 token 的替换表（小写键: 角色编号）
character_replacements:
  - "[未登记token1]: C001"
  - "[未登记token2]: C002"

# reviewer_agent 换书硬约束（初期卷额外扣分项），每行一条。
# 缺省（整段删除）时回退 reviewer_agent 内置默认（当前陆烬书 ch1-9 陈老根约束）。
review_hard_constraints:
  - "[配角名]背景/回忆中严禁具体化[体制]身份：不得出现「[禁用词表]」；白名单「[允许词表]」允许保留。"
  - "ch[起]-[止] [配角名]严禁主动施展修为：不得出现「气感/内视/行气探查/气机探查/吐纳/调息」；「内视他人脏腑」整个初期卷始终禁止。"
  - "不得建议任何超出当前章大纲阶段的人物背景具体化或后续章才解锁的能力（上述词条一律禁止出现在 suggested_fix 中）。"
