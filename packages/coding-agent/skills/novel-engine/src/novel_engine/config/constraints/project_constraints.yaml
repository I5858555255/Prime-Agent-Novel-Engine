# 项目约束包（跨项目复用：换书时替换本文件即可，流程脚本不动）
#
# 被 audit_mid_outline / outline_repair / 中纲生成共用的项目级内容约束。
# 引擎层（StateDB / 质量门 / checkpoint）与流程层（看护 / 统计 / 拼接）
# 不读本文件，只读 config/planning/ 下既有权威文件；本包是"创作约束"的
# 单一出处，供中纲校验与自动修复引用。
#
# 条目格式约定（无 PyYAML 依赖的受限子集）：
#   - 列表条目 "- \"K: V\"" 解析为字典项 K->V（K 含正则/中文均可）
#   - 列表条目 "- \"A = B\"" 解析为 (A, B) 二元组
#   - 标量 "key: value" 直接取值
# 换书时整文件替换；各节缺省时消费方退回内置默认值（本项目现值）。

# A 路线 #8 类硬边界：主角第一阶段（筑基前）禁止修炼样式动作。
# 换书时：改主角/独修者姓名与正则（或整段删除本节）。
# 主语判定用"紧邻"而非宽间隔，避免把"旁观/被告知"误判为主角修炼。
# 条目格式：正则 = 原因
a_route_patterns:
  - "陆烬(亲自|独自|也跟着|也|在山林间|在屋里|晚间|夜晚|白天|偷偷|默默)?(练习|修炼|运转|引气|吐纳|打坐|调息|催动) = 陆烬亲自出现修炼样式动作"
  - "陆烬.{0,4}(照着|学着|模仿|跟着).{0,10}(练|练习|呼吸法|吐纳) = 陆烬模仿修炼样式动作"
  - "陆烬.{0,12}体内.{0,20}(运转|流转|共鸣|气感|气流|暖意|灵气|气机) = 陆烬体内出现气机运转/共鸣"
  - "(练|修炼|运转|引气|吐纳|打坐|调息)的.{0,8}(是|主角|他) = 动作主语指回陆烬"

# 锚点追加模板：fid 锚点未命中时 force-append 进 core_event 的短语。
# 条目格式：fid: 短语（换书时按新伏笔体系填，缺省 fid 不追加）
anchor_phrases:
  - "f001: 七窍碑残片在匣中若隐若现"
  - "f002: 陆烬被动性约束（仅旁观/被告知）"
  - "f005: 迷雾边缘的余韵在指尖若隐若现"
  - "f006: 共守派残脉与传国玉玺"
  - "f008: 守夜人低声自陈'我是门之影'"
  - "f009: 陆烬对两界神魂的异常感知仅停留在间接察觉层面"

# 合规尾注：追加 f009 类锚点时同步写入 boundary_note 的声明。
compliance_note: "（A路线#8合规：陆烬此阶段仅旁观/被告知，修炼样式动作限陈老根；plant@本章, resolve@3800 前）"

# 中纲 characters 字段未登记 token 的替换表（小写键）。
# 条目格式：键: 值（换书时改角色编号；未登记自由名走 audit 的 character_registry 流程）
character_replacements:
  - "f008: C007"
  - "f008_doorkeeper: C007"
  - "f008守夜人: C007"
  - "后续角色: C007"
  - "摄魂阁高层: C007"
  - "c007（守夜人）: C007"
  - "c007(守夜人): C007"

# reviewer_agent 的换书硬约束（婴儿卷/初期卷额外扣分项）。
# 每行一条 "- \"...\""；缺省（本节缺失）时回退 reviewer_agent 内置默认
# （当前陆烬书 ch1-9 婴儿卷陈老根约束）。换书时按新书改本节或整段删除。
review_hard_constraints:
  - "配角陈老根的背景/回忆/往事中严禁具体化体制身份：不得出现「军中/从军/军营/军医/军中医/医官/教头/将军/千总/百户/朝廷命官/当差官府」等词；白名单「习武/江湖/走南闯北/佩刀」允许保留。"
  - "ch1-5 陈老根严禁主动施展修为：不得出现「气感/内视/行气探查/气机探查/吐纳/调息」；ch6 起仅放开「陈老根夜间独自吐纳、陆烬旁观窥见」一种受控形态；「内视他人脏腑」整个婴儿卷（ch1-9）始终禁止。"
  - "不得建议任何超出当前章大纲阶段的人物背景具体化或后续章才解锁的能力（上述词条一律禁止出现在 suggested_fix 中）。"
