[project]
name = "prime-agent-skill-attach-media"
version = "0.1.0"
description = "Load on-disk images into the model's context as viewable attachments."
requires-python = ">=3.10"
dependencies = ["prime-agent-runtime"]

[project.scripts]
attach-media = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attach_media"]
