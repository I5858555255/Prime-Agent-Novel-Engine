<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="ABC Favorit Mono, ui-monospace, 'SF Mono', Menlo, monospace" role="img" aria-labelledby="title desc">
  <!-- prime-intellect-data-viz: trusted -->
  <title id="title">Prime Agent storage and trust boundaries</title>
  <desc id="desc">Local configuration, session JSONL, and artifacts are owned by the worker. Providers are an external network boundary, while extensions and IPython execute with local user permissions.</desc>
  <rect width="1200" height="700" fill="#111111"/>
  <text x="56" y="54" fill="#FFFFFF" font-size="24" font-weight="600">STORAGE + TRUST BOUNDARIES</text>
  <text x="56" y="82" fill="#7A7A7A" font-size="13" letter-spacing="1.2">DURABLE LOCAL STATE · EXECUTABLE LOCAL RESOURCES · EXTERNAL MODEL API</text>

  <rect x="56" y="120" width="720" height="482" fill="none" stroke="#B6FF3C" stroke-width="1.5"/>
  <text x="78" y="154" fill="#B6FF3C" font-size="12" letter-spacing="1.4">LOCAL PRIME AGENT STATE · ~/.prime/agent</text>

  <rect x="78" y="180" width="208" height="126" fill="none" stroke="#353535"/>
  <text x="96" y="212" fill="#7A7A7A" font-size="12" letter-spacing="1.3">CONFIG + AUTH</text>
  <text x="96" y="244" fill="#FFFFFF" font-size="16">auth.json</text>
  <text x="96" y="268" fill="#FFFFFF" font-size="16">models.json</text>
  <text x="96" y="292" fill="#FFFFFF" font-size="16">settings.json</text>

  <rect x="306" y="180" width="448" height="126" fill="none" stroke="#353535"/>
  <text x="324" y="212" fill="#7A7A7A" font-size="12" letter-spacing="1.3">SESSION JSONL · APPEND-ORIENTED TREE</text>
  <text x="324" y="244" fill="#FFFFFF" font-size="16">messages · model changes · compaction</text>
  <text x="324" y="270" fill="#FFFFFF" font-size="16">labels · state · refinement</text>
  <text x="324" y="296" fill="#B6FF3C" font-size="16">child_usage_attributed</text>

  <rect x="78" y="330" width="676" height="244" fill="none" stroke="#353535"/>
  <text x="96" y="362" fill="#7A7A7A" font-size="12" letter-spacing="1.3">SESSION ARTIFACTS · session-artifacts/&lt;session-id&gt;</text>

  <rect x="96" y="386" width="192" height="72" fill="none" stroke="#353535"/>
  <text x="112" y="416" fill="#FFFFFF" font-size="15">kernel-state.*</text>
  <text x="112" y="440" fill="#7A7A7A" font-size="12">namespace revival</text>

  <rect x="306" y="386" width="202" height="72" fill="none" stroke="#353535"/>
  <text x="322" y="416" fill="#FFFFFF" font-size="15">scheduled-jobs.json</text>
  <text x="322" y="440" fill="#7A7A7A" font-size="12">per-session claims</text>

  <rect x="526" y="386" width="210" height="72" fill="none" stroke="#353535"/>
  <text x="542" y="416" fill="#FFFFFF" font-size="15">harness/</text>
  <text x="542" y="440" fill="#7A7A7A" font-size="12">local refinements</text>

  <rect x="96" y="482" width="640" height="68" fill="none" stroke="#353535"/>
  <text x="112" y="512" fill="#FFFFFF" font-size="15">sub-xxxxxxxx/ → child transcript + nested artifacts</text>
  <text x="112" y="536" fill="#7A7A7A" font-size="12">one recursive ownership tree under the root artifact directory</text>

  <path d="M 782 242 L 854 242 M 854 242 L 846.5 237.5 M 854 242 L 846.5 246.5" fill="none" stroke="#B6FF3C" stroke-width="1.5"/>
  <rect x="860" y="170" width="284" height="144" fill="none" stroke="#353535"/>
  <text x="880" y="204" fill="#7A7A7A" font-size="12" letter-spacing="1.3">NETWORK BOUNDARY</text>
  <text x="880" y="238" fill="#FFFFFF" font-size="18">Model provider</text>
  <text x="880" y="266" fill="#BCBCBC" font-size="13">prompt + tool schema out</text>
  <text x="880" y="290" fill="#BCBCBC" font-size="13">stream + usage in</text>

  <path d="M 782 446 L 854 446 M 854 446 L 846.5 441.5 M 854 446 L 846.5 450.5" fill="none" stroke="#B6FF3C" stroke-width="1.5"/>
  <rect x="860" y="358" width="284" height="184" fill="none" stroke="#353535"/>
  <text x="880" y="392" fill="#7A7A7A" font-size="12" letter-spacing="1.3">EXECUTION BOUNDARY</text>
  <text x="880" y="426" fill="#FFFFFF" font-size="18">Extensions + IPython</text>
  <text x="880" y="454" fill="#BCBCBC" font-size="13">arbitrary local code</text>
  <text x="880" y="478" fill="#BCBCBC" font-size="13">workspace + subprocess access</text>
  <line x1="880" y1="500" x2="1124" y2="500" stroke="#353535"/>
  <text x="880" y="526" fill="#FFFFFF" font-size="13">NOT A SECURITY SANDBOX</text>

  <line x1="56" y1="636" x2="1144" y2="636" stroke="#353535"/>
  <text x="56" y="664" fill="#7A7A7A" font-size="12" letter-spacing="1.2">LEASE INVARIANT</text>
  <text x="194" y="664" fill="#BCBCBC" font-size="13">one active writer per canonical session JSONL path</text>
  <text x="704" y="664" fill="#7A7A7A" font-size="12">Use external isolation for untrusted code.</text>
</svg>
