requires-python = ">=3.11,<3.15"
dependencies = [
  "beautifulsoup4",
  "cython; sys_platform == 'android'",
  "dill",
  "httpx",
  "hatchling==1.27.0",
  "ipykernel",
  "lxml",
  "meson; sys_platform == 'android'",
  "meson-python; sys_platform == 'android'",
  "nest-asyncio",
  "numpy==2.4.4",
  "pandas",
  "pydantic",
  "python-dotenv",
