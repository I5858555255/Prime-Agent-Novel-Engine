[project]
name = "prime-agent-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for Prime Agent recursion"
requires-python = ">=3.10"
dependencies = [
  "ipykernel",
  "nest-asyncio",
  "tyro",
]

[dependency-groups]
test = [
  "httpx",
  "mcp>=1.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]
