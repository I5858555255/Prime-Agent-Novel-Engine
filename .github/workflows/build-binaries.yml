name: Release Prime Agent

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  release-context:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      startsWith(github.event.comment.body, '/prime-agent release retry ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.context.outputs.beta_version }}
      build_ref: ${{ steps.context.outputs.build_ref }}
      build_sha: ${{ steps.context.outputs.build_sha }}
      production_version: ${{ steps.context.outputs.production_version }}
      publish_beta: ${{ steps.context.outputs.publish_beta }}
      publish_production: ${{ steps.context.outputs.publish_production }}
      trigger: ${{ steps.context.outputs.trigger }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Authorize release retry
        id: authorization
        if: github.event_name == 'issue_comment'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$permission" in
            admin|maintain) ;;
            *) echo "Release commands require admin or maintain permission." >&2; exit 1 ;;
          esac
          echo "permission=$permission" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve release context
        id: context
        env:
          ACTOR_PERMISSION: ${{ steps.authorization.outputs.permission || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event || '' }}
          UPSTREAM_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          UPSTREAM_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name || '' }}
          UPSTREAM_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          UPSTREAM_WORKFLOW_PATH: ${{ github.event.workflow_run.path || '' }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/resolve-release-context.mjs

  full-ci:
    if: needs.release-context.outputs.trigger == 'retry'
    needs: release-context
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.release-context.outputs.build_sha }}
      tooling_sha: ${{ github.workflow_sha }}

  build:
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_SHA: ${{ needs.release-context.outputs.build_sha }}
      PRIME_AGENT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false

      - name: Checkout validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.BUILD_SHA }}
          path: release-source
          persist-credentials: false

      - name: Verify release source commit
        working-directory: release-source
        run: test "$(git rev-parse HEAD)" = "$BUILD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Build
        working-directory: release-source
        run: npm run build

      - name: Capture post-build source baseline
        working-directory: release-source
        run: |
          git diff --binary --full-index > "$RUNNER_TEMP/release-build-worktree.diff"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/release-build-index.diff"

      - name: Check
        working-directory: release-source
        run: npm run check

      - name: Test protected release tooling
        working-directory: release-source
        run: >-
          node --test
          ../release-tooling/scripts/release-lifecycle.test.mjs
          ../release-tooling/scripts/release-publication.test.mjs
          ../release-tooling/scripts/release-workflow-contract.test.mjs
          ../release-tooling/scripts/release-workflow.test.mjs

      - name: Verify validation did not mutate release source
        working-directory: release-source
        run: |
          git diff --binary --full-index > "$RUNNER_TEMP/release-check-worktree.diff"
          git diff --cached --binary --full-index > "$RUNNER_TEMP/release-check-index.diff"
          if ! cmp -s "$RUNNER_TEMP/release-build-worktree.diff" "$RUNNER_TEMP/release-check-worktree.diff"; then
            diff -u "$RUNNER_TEMP/release-build-worktree.diff" "$RUNNER_TEMP/release-check-worktree.diff" || true
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/release-build-index.diff" "$RUNNER_TEMP/release-check-index.diff"; then
            diff -u "$RUNNER_TEMP/release-build-index.diff" "$RUNNER_TEMP/release-check-index.diff" || true
            exit 1
          fi

      - name: Pack production release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          node ../release-tooling/scripts/pack-prime-agent-release.mjs \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --source-sha "$BUILD_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/production
          node ../release-tooling/scripts/release-dry-run.mjs \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --source-sha "$BUILD_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --artifacts-dir packages/coding-agent/release/production/artifacts
          node ../release-tooling/scripts/verify-release-artifacts.mjs \
            --channel stable \
            --directory packages/coding-agent/release/production/artifacts \
            --source-sha "$BUILD_SHA" \
            --version "$PRODUCTION_VERSION"

      - name: Pack beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          node ../release-tooling/scripts/pack-prime-agent-release.mjs \
            --channel beta \
            --version "$BETA_VERSION" \
            --source-sha "$BUILD_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/beta
          node ../release-tooling/scripts/release-dry-run.mjs \
            --channel beta \
            --version "$BETA_VERSION" \
            --source-sha "$BUILD_SHA" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --artifacts-dir packages/coding-agent/release/beta/artifacts
          node ../release-tooling/scripts/verify-release-artifacts.mjs \
            --channel beta \
            --directory packages/coding-agent/release/beta/artifacts \
            --source-sha "$BUILD_SHA" \
            --version "$BETA_VERSION"

      - name: Upload production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prime-agent-production-${{ env.BUILD_SHA }}
          path: release-source/packages/coding-agent/release/production/artifacts/*
          if-no-files-found: error
          overwrite: true

      - name: Upload beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prime-agent-beta-${{ env.BUILD_SHA }}
          path: release-source/packages/coding-agent/release/beta/artifacts/*
          if-no-files-found: error
          overwrite: true

  release-gate:
    if: always() && needs.release-context.result == 'success'
    runs-on: ubuntu-latest
    needs: [release-context, full-ci, build]
    permissions:
      contents: read
    outputs:
      beta_version: ${{ needs.release-context.outputs.beta_version }}
      build_sha: ${{ needs.release-context.outputs.build_sha }}
      production_version: ${{ needs.release-context.outputs.production_version }}
      publish_beta: ${{ needs.release-context.outputs.publish_beta }}
      publish_production: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify release gate
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          RELEASE_CONTEXT_RESULT: ${{ needs.release-context.result }}
          RELEASE_TRIGGER: ${{ needs.release-context.outputs.trigger }}
        run: |
          node scripts/verify-release-gate.mjs \
            "release-context=$RELEASE_CONTEXT_RESULT" \
            "full-ci=$FULL_CI_RESULT" \
            "build=$BUILD_RESULT" \
            "trigger=$RELEASE_TRIGGER"

  publish:
    runs-on: ubuntu-latest
    needs: release-gate
    environment: production
    concurrency:
      group: release-prime-agent
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BETA_VERSION: ${{ needs.release-gate.outputs.beta_version }}
      BUILD_SHA: ${{ needs.release-gate.outputs.build_sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PRIME_AGENT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      PRODUCTION_VERSION: ${{ needs.release-gate.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-gate.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-gate.outputs.publish_production }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false

      - name: Checkout validated release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.BUILD_SHA }}
          path: release-source
          persist-credentials: false

      - name: Verify release source commit
        working-directory: release-source
        run: test "$(git rev-parse HEAD)" = "$BUILD_SHA"

      - name: Download production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/download-artifact@3e5f45b3455f8bb19e09b3fb854d966fb27682a2 # v8.0.1
        with:
          name: prime-agent-production-${{ env.BUILD_SHA }}
          path: release-artifacts/production

      - name: Download beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/download-artifact@3e5f45b3455f8bb19e09b3fb854d966fb27682a2 # v8.0.1
        with:
          name: prime-agent-beta-${{ env.BUILD_SHA }}
          path: release-artifacts/beta

      - name: Verify production artifact provenance
        if: env.PUBLISH_PRODUCTION == 'true'
        run: >-
          node release-tooling/scripts/verify-release-artifacts.mjs
          --channel stable
          --directory release-artifacts/production
          --source-sha "$BUILD_SHA"
          --version "$PRODUCTION_VERSION"

      - name: Verify beta artifact provenance
        if: env.PUBLISH_BETA == 'true'
        run: >-
          node release-tooling/scripts/verify-release-artifacts.mjs
          --channel beta
          --directory release-artifacts/beta
          --source-sha "$BUILD_SHA"
          --version "$BETA_VERSION"

      - name: Prepare installers
        working-directory: release-source
        run: |
          INSTALL_BASE_URL="${R2_PUBLIC_BASE_URL%/}"
          test -n "$INSTALL_BASE_URL"
          node ../release-tooling/scripts/render-release-installers.mjs \
            "$INSTALL_BASE_URL" \
            /tmp/prime-agent-install.sh \
            /tmp/prime-agent-install-beta.sh

      - name: Extract production release notes
        if: env.PUBLISH_PRODUCTION == 'true'
        working-directory: release-source
        run: |
          awk "/^## \[${PRODUCTION_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${PRODUCTION_VERSION}" > /tmp/release-notes.md
          fi

      - name: Prepare production GitHub release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production-github-prepare \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA" \
            --notes-file /tmp/release-notes.md

      - name: Publish production immutable objects to R2
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production-r2-immutable \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA"

      - name: Publish production GitHub assets
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production-github-assets \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA" \
            --notes-file /tmp/release-notes.md

      - name: Publish production installers to R2
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production-r2-installers \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA" \
            --stable-installer /tmp/prime-agent-install.sh \
            --beta-installer /tmp/prime-agent-install-beta.sh

      - name: Promote production channel in R2
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production-r2-promote \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA"

      - name: Publish beta immutable objects to R2
        if: env.PUBLISH_BETA == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs beta-r2-immutable \
            --artifacts-dir ../release-artifacts/beta \
            --version "$BETA_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA"

      - name: Check beta freshness before GitHub mirror
        if: env.PUBLISH_BETA == 'true'
        id: beta_github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
          test "$latest_main_sha" = "$BUILD_SHA"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Advance beta GitHub release
        if: env.PUBLISH_BETA == 'true' && steps.beta_github.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs beta-github \
            --artifacts-dir ../release-artifacts/beta \
            --version "$BETA_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA" \
            --default-branch "$DEFAULT_BRANCH"

      - name: Check beta freshness before installers
        if: env.PUBLISH_BETA == 'true'
        id: beta_installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
          test "$latest_main_sha" = "$BUILD_SHA"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Advance beta installers in R2
        if: env.PUBLISH_BETA == 'true' && steps.beta_installers.outputs.current == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs beta-r2-installers \
            --artifacts-dir ../release-artifacts/beta \
            --version "$BETA_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA" \
            --stable-installer /tmp/prime-agent-install.sh \
            --beta-installer /tmp/prime-agent-install-beta.sh

      - name: Check beta freshness before channel promotion
        if: env.PUBLISH_BETA == 'true'
        id: beta_promotion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
          test "$latest_main_sha" = "$BUILD_SHA"
          echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Advance beta channel in R2
        if: env.PUBLISH_BETA == 'true' && steps.beta_promotion.outputs.current == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs beta-r2-promote \
            --artifacts-dir ../release-artifacts/beta \
            --version "$BETA_VERSION" \
            --build-ref "$BUILD_SHA" \
            --source-sha "$BUILD_SHA"
