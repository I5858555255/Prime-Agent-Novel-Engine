name: Release Prime Agent

on:
  push:
    branches:
      - main
  issue_comment:
    types: [created]

concurrency:
  group: release-prime-agent
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release-context:
    if: github.event_name == 'push' || startsWith(github.event.comment.body, '/prime-agent release retry ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.context.outputs.beta_version }}
      build_ref: ${{ steps.context.outputs.build_ref }}
      production_version: ${{ steps.context.outputs.production_version }}
      publish_beta: ${{ steps.context.outputs.publish_beta }}
      publish_production: ${{ steps.context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Authorize release comment
        id: authorization
        if: github.event_name == 'issue_comment'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)
          case "$permission" in
            admin|maintain) ;;
            *) echo "Release commands require admin or maintain permission." >&2; exit 1 ;;
          esac
          echo "permission=$permission" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Resolve release context
        id: context
        env:
          ACTOR_PERMISSION: ${{ steps.authorization.outputs.permission || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: node scripts/resolve-release-context.mjs

  build:
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRIME_AGENT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false

      - name: Checkout validated release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.BUILD_REF }}
          path: release-source
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: release-source
        run: npm ci

      - name: Build
        working-directory: release-source
        run: npm run build

      - name: Check
        working-directory: release-source
        run: npm run check

      - name: Test release lifecycle
        working-directory: release-source
        run: node --test ../release-tooling/scripts/release-lifecycle.test.mjs ../release-tooling/scripts/release-publication.test.mjs ../release-tooling/scripts/release-workflow-contract.test.mjs

      - name: Pack production release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          node ../release-tooling/scripts/pack-prime-agent-release.mjs \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/production

      - name: Dry-run production release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/release-dry-run.mjs \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --artifacts-dir packages/coding-agent/release/production/artifacts

      - name: Pack beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          test -n "$PRIME_AGENT_DOWNLOAD_BASE_URL"
          node ../release-tooling/scripts/pack-prime-agent-release.mjs \
            --channel beta \
            --version "$BETA_VERSION" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --out-dir packages/coding-agent/release/beta

      - name: Dry-run beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          PRIME_AGENT_DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/release-dry-run.mjs \
            --channel beta \
            --version "$BETA_VERSION" \
            --base-url "$PRIME_AGENT_DOWNLOAD_BASE_URL" \
            --artifacts-dir packages/coding-agent/release/beta/artifacts

      - name: Upload production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prime-agent-production
          path: release-source/packages/coding-agent/release/production/artifacts/*
          if-no-files-found: error

      - name: Upload beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: prime-agent-beta
          path: release-source/packages/coding-agent/release/beta/artifacts/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-context, build]
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_DEFAULT_REGION: auto
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PRIME_AGENT_RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
    steps:
      - name: Checkout protected release tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          persist-credentials: false

      - name: Checkout validated release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.BUILD_REF }}
          path: release-source
          persist-credentials: false

      - name: Download production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/download-artifact@v8
        with:
          name: prime-agent-production
          path: release-artifacts/production

      - name: Download beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/download-artifact@v8
        with:
          name: prime-agent-beta
          path: release-artifacts/beta

      - name: Prepare installers
        working-directory: release-source
        run: |
          INSTALL_BASE_URL="${R2_PUBLIC_BASE_URL%/}"
          test -n "$INSTALL_BASE_URL"
          node ../release-tooling/scripts/render-release-installers.mjs \
            "$INSTALL_BASE_URL" \
            /tmp/prime-agent-install.sh \
            /tmp/prime-agent-install-beta.sh

      - name: Extract production release notes
        if: env.PUBLISH_PRODUCTION == 'true'
        working-directory: release-source
        run: |
          awk "/^## \[${PRODUCTION_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${PRODUCTION_VERSION}" > /tmp/release-notes.md
          fi

      - name: Publish production transaction
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs production \
            --artifacts-dir ../release-artifacts/production \
            --version "$PRODUCTION_VERSION" \
            --build-ref "$BUILD_REF" \
            --notes-file /tmp/release-notes.md \
            --stable-installer /tmp/prime-agent-install.sh \
            --beta-installer /tmp/prime-agent-install-beta.sh

      - name: Publish beta transaction
        if: env.PUBLISH_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: release-source
        run: |
          node ../release-tooling/scripts/publish-release.mjs beta \
            --artifacts-dir ../release-artifacts/beta \
            --version "$BETA_VERSION" \
            --build-ref "$BUILD_REF" \
            --default-branch "$DEFAULT_BRANCH" \
            --stable-installer /tmp/prime-agent-install.sh \
            --beta-installer /tmp/prime-agent-install-beta.sh

