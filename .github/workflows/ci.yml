name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-core
            package: packages/agent
            command: npm test
            install_uv: false
          - name: ai
            package: packages/ai
            command: npm test
            install_uv: false
          - name: tui
            package: packages/tui
            command: npm test
            install_uv: false
          - name: coding-agent 1/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=1/3
            install_uv: true
          - name: coding-agent 2/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=2/3
            install_uv: true
          - name: coding-agent 3/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=3/3
            install_uv: true
          - name: coding-agent process smoke
            package: packages/coding-agent
            command: npm run test:process
            install_uv: true
          - name: coding-agent kernel
            package: packages/coding-agent
            command: npm run test:kernel
            install_uv: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install uv
        if: matrix.install_uv
        run: |
          python3 -m pip install --user uv==0.11.33
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.command }}

  kernel-lock:
    name: Kernel lock matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.11.15

      - name: Install pinned uv
        run: python -m pip install uv==0.11.33

      - name: Validate lock without mutation
        run: npm run check:python-lock

  kernel-windows:
    name: Kernel bootstrap (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Install pinned uv
        shell: pwsh
        run: |
          python -m pip install uv==0.11.33
          uv python install 3.11.15

      - name: Validate native Windows environment
        shell: pwsh
        run: |
          npm run check:python-lock
          $venv = Join-Path $env:RUNNER_TEMP "prime-agent-kernel"
          $cutoff = node -p "JSON.parse(require('fs').readFileSync('prime-agent-runtime/kernel/toolchain.json')).excludeNewer"
          uv venv $venv --python 3.11.15 --seed --relocatable
          $env:VIRTUAL_ENV = $venv
          uv sync --project prime-agent-runtime/kernel --locked --active --no-dev --no-install-project --no-build --exclude-newer $cutoff --python-platform x86_64-pc-windows-msvc
          uv pip install --python "$venv/Scripts/python.exe" --no-build-isolation --no-deps prime-agent-runtime
          uv pip check --python "$venv/Scripts/python.exe"
          & "$venv/Scripts/python.exe" -c "import httpx, ipykernel, lxml, numpy, pandas, pydantic, rlm, scipy"

  kernel-termux:
    name: Kernel bootstrap (Termux/Bionic)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate real Termux environment
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            --tmpfs /bin:rw,mode=1777 \
            termux/termux-docker:aarch64@sha256:ba0d1e457d7d54c8e5067059f8aff66fbebcf20e4478a5a07186bc570e605822 \
            bash -lc 'pkg update -y && pkg install -y nodejs python rust clang make cmake ninja pkg-config libxml2 libxslt libopenblas zstd flang binutils patchelf python-lxml=6.1.1-1 python-numpy=2.4.4-1 python-psutil=7.2.2-2 python-scipy=1.18.0-1 && ln -sf "$PREFIX/bin/sh" /bin/sh && bash /workspace/scripts/install-termux-uv.sh && export PATH="$HOME/.local/bin:$PATH" && PRIME_AGENT_TERMUX_VALIDATION=1 bash /workspace/scripts/validate-termux-kernel-lock.sh /workspace'

  build-check-test:
    name: build-check-test
    if: always()
    needs: [build-check, test, kernel-lock, kernel-windows, kernel-termux]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          KERNEL_LOCK_RESULT: ${{ needs.kernel-lock.result }}
          KERNEL_WINDOWS_RESULT: ${{ needs.kernel-windows.result }}
          KERNEL_TERMUX_RESULT: ${{ needs.kernel-termux.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$TEST_RESULT" = success
          test "$KERNEL_LOCK_RESULT" = success
          test "$KERNEL_WINDOWS_RESULT" = success
          test "$KERNEL_TERMUX_RESULT" = success
